apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-py
spec:
  replicas: 1
  # Selector and template labels are injected by Kustomize (commonLabels/labels transformer)
  template:
    spec:
      containers:
        - name: app
          image: harbor.luban.metasync.cc/metasync/hello-world-py:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hello-world-py-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

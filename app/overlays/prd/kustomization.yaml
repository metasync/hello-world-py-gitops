apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: prd-metasync

patches:
  - target:
      kind: HTTPRoute
      name: hello-world-py
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: "hello-world-py.apps.metasync.cc"
  - path: configmap.yaml

replicas:
  - name: hello-world-py
    count: 2

# Explicitly defining images allows Kustomize to override the tag
# This is often used by CI/CD pipelines (e.g., `kustomize edit set image ...`)
images:
  - name: quay.io/luban-ci/luban-hello-world-py
    newTag: latest
